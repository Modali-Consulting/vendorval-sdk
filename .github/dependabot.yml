version: 2
updates:
  # Published Node.js / TypeScript SDK package (npm).
  - package-ecosystem: "npm"
    directory: "/packages/node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Collapse the routine minor/patch churn into a single PR per week.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Published Python SDK package (pip / pyproject).
  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions pinned versions current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
