name: Dependency Review

# Scans dependency manifest changes on every PR and fails when a newly
# introduced dependency carries a known high-severity (or worse) advisory.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
