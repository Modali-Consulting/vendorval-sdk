name: Add issue to VendorVal project

on:
  issues:
    types: [opened, transferred]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/vendorval/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}

